name: P1-4 verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tooling
        run: python -m pip install build
      - name: Build sdist and wheel from sdist
        run: python -m build
      - name: Install wheel
        run: python -m pip --disable-pip-version-check install --no-index --no-deps dist/evaluation_closure_toolkit-0.1.0.dev4-py3-none-any.whl
      - name: Test public behavior
        run: python -m unittest discover -s tests -v
      - name: Verify schema generation
        run: python scripts/generate_schema.py --check
      - name: Verify isolated installed distribution
        run: python scripts/check_install.py --wheel dist/evaluation_closure_toolkit-0.1.0.dev4-py3-none-any.whl
