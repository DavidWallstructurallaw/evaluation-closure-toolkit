name: Qualification and authorized release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install build tooling
        run: python -m pip install build
      - name: Build exact-source candidate through sdist
        run: python scripts/build_candidate.py --revision "${{ github.event.pull_request.head.sha || github.sha }}" --output "${{ runner.temp }}/ect-candidate"
      - name: Install wheel
        run: python -m pip --disable-pip-version-check install --no-index --no-deps "${{ runner.temp }}/ect-candidate/dist/evaluation_closure_toolkit-0.1.0-py3-none-any.whl"
      - name: Test extracted source against installed candidate
        working-directory: ${{ runner.temp }}/ect-candidate/from-sdist/evaluation_closure_toolkit-0.1.0
        run: python -m unittest discover -s tests -v
      - name: Verify schema generation
        working-directory: ${{ runner.temp }}/ect-candidate/from-sdist/evaluation_closure_toolkit-0.1.0
        run: python scripts/generate_schema.py --check
      - name: Verify isolated installed distribution and actual user examples
        working-directory: ${{ runner.temp }}/ect-candidate/from-sdist/evaluation_closure_toolkit-0.1.0
        run: python scripts/check_install.py --wheel "${{ runner.temp }}/ect-candidate/dist/evaluation_closure_toolkit-0.1.0-py3-none-any.whl" --expected-build-id "ect-0.1.0+git.${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Verify release asset manifest without publishing
        run: python scripts/publish_release.py --artifact-directory "${{ runner.temp }}/ect-candidate" --revision "${{ github.event.pull_request.head.sha || github.sha }}" --check-only
      - name: Retain qualified candidate artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/ect-candidate/dist/
            ${{ runner.temp }}/ect-candidate/artifacts.json
          if-no-files-found: error
          retention-days: 30

  release:
    # The owner-approved stable merge must explicitly opt in. Later main pushes
    # remain qualification-only, and pull requests never receive a write token.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-v0.1.0]')
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: publish-v0.1.0
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Download this run's qualified Ubuntu 3.12 artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-ubuntu-22.04-py3.12
          path: ${{ runner.temp }}/ect-release
          digest-mismatch: error
      - name: Publish verified v0.1.0 assets after all four cells pass
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py --artifact-directory "${{ runner.temp }}/ect-release" --revision "${{ github.sha }}" --notes docs/releases/0.1.0.md
