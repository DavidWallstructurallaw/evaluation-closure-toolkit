[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluation-closure-toolkit"
version = "0.1.0.dev3"
description = "An offline auditor for supplied AI evaluation dossiers."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/DavidWallstructurallaw/evaluation-closure-toolkit"

[project.scripts]
evaluation-closure = "evaluation_closure_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evaluation_closure_toolkit = ["data/*.json"]
